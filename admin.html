<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة ربح</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white;min-height:100vh}
.container{width:94%;max-width:700px;margin:25px auto}
.card{background:white;color:#111827;border-radius:18px;padding:20px;margin-bottom:18px}
h1,h2{text-align:center}
input,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;font-size:16px}
button{border:0;background:#2563eb;color:white;font-weight:bold}
.logout{background:#dc2626}
.request{background:#f3f4f6;border-radius:14px;padding:15px;margin-top:12px}
.hidden{display:none}
.error{color:red;text-align:center;margin-top:10px}
</style>
</head>

<body>
<div class="container">

<div id="loginPage" class="card">
<h1>🔐 إدارة تطبيق ربح</h1>
<p style="text-align:center">دخول المدير</p>

<input id="adminUsername" type="text" placeholder="اسم المدير">
<input id="adminPassword" type="password" placeholder="كلمة مرور المدير">

<button id="loginButton">دخول الإدارة</button>
<div id="loginMessage"></div>
</div>

<div id="adminPage" class="hidden">

<div class="card">
<h1>⚙️ لوحة إدارة ربح</h1>
<p style="text-align:center">إدارة طلبات السحب</p>

<button id="refreshButton">🔄 تحديث الطلبات</button>
<button id="logoutButton" class="logout">تسجيل الخروج</button>
</div>

<div class="card">
<h2>💵 طلبات السحب</h2>
<div id="withdrawals">جاري تحميل الطلبات...</div>
</div>

</div>
</div>

<script>
const SUPABASE_URL="https://jfpmniqxdwrvnpjlatkk.supabase.co";
const SUPABASE_KEY="sb_publishable_u4ECIUzh0GhGkVil012xHQ_w_C7urtY";

document.getElementById("loginButton").onclick=adminLogin;
document.getElementById("refreshButton").onclick=loadWithdrawals;
document.getElementById("logoutButton").onclick=()=>location.reload();

function msg(t,e=false){
const x=document.getElementById("loginMessage");
x.textContent=t;
x.className=e?"error":"";
}

async function request(table,opt={}){
const r=await fetch(SUPABASE_URL+"/rest/v1/"+table,{
...opt,
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
...(opt.headers||{})
}
});
const t=await r.text();
if(!r.ok)throw new Error("HTTP "+r.status+": "+t);
return t?JSON.parse(t):null;
}

async function adminLogin(){
const u=document.getElementById("adminUsername").value.trim();
const p=document.getElementById("adminPassword").value.trim();

if(u==="admin"&&p==="123456"){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("adminPage").classList.remove("hidden");
await loadWithdrawals();
}else{
msg("❌ اسم المدير أو كلمة المرور غير صحيحة.",true);
}
}

async function loadWithdrawals(){
const box=document.getElementById("withdrawals");
box.textContent="جاري تحميل الطلبات...";

try{
const data=await request("withdrawals?select=*&order=created_at.desc");

if(!data.length){
box.textContent="لا توجد طلبات سحب.";
return;
}

box.innerHTML="";

data.forEach(item=>{
const d=document.createElement("div");
d.className="request";

d.innerHTML=
"<b>👤 المستخدم:</b> "+(item.username||"")+"<br><br>"+
"<b>💰 النقاط:</b> "+(item.points||"")+"<br><br>"+
"<b>📱 طريقة السحب:</b> "+(item.method||"")+"<br><br>"+
"<b>📞 الحساب:</b> "+(item.account||"")+"<br><br>"+
"<b>📌 الحالة:</b> "+(item.status||"")+"<br><br>"+
"<b>📅 التاريخ:</b> "+new Date(item.created_at).toLocaleString("ar-IQ");

const pay=document.createElement("button");
pay.textContent="✅ تم الدفع";
pay.onclick=()=>changeStatus(item.id,"تم الدفع");

const reject=document.createElement("button");
reject.textContent="❌ رفض الطلب";
reject.style.background="#dc2626";
reject.onclick=()=>changeStatus(item.id,"مرفوض");

d.appendChild(pay);
d.appendChild(reject);
box.appendChild(d);
});

}catch(e){
box.textContent="❌ حدث خطأ: "+e.message;
}
}

async function changeStatus(id,status){
try{
await request("withdrawals?id=eq."+encodeURIComponent(id),{
method:"PATCH",
headers:{"Prefer":"return=minimal"},
body:JSON.stringify({status:status})
});
alert("✅ تم تغيير حالة الطلب");
await loadWithdrawals();
}catch(e){
alert("❌ حدث خطأ: "+e.message);
}
}
</script>
</body>
</html>
