<script>
/* أضف المهمة الرابعة داخل قسم المهام بعد المهمة 3 */

const task4HTML = `
<div class="task">
  <b>المهمة 4</b>
  <p>احصل على 40 نقطة</p>
  <button id="task4" onclick="completeTask(4)">
    🎁 تنفيذ المهمة +40
  </button>
</div>
`;

document.addEventListener("DOMContentLoaded", function(){

  const tasksContainer =
    document.querySelector("#task3").parentElement.parentElement;

  tasksContainer.insertAdjacentHTML(
    "beforeend",
    task4HTML
  );

});


/* استبدال دالة completeTask */

async function completeTask(number){

  if(completedTasks.includes(number)){
    return;
  }

  let points = 0;

  if(number === 1) points = 10;
  if(number === 2) points = 20;
  if(number === 3) points = 30;
  if(number === 4) points = 40;

  userBalance += points;

  completedTasks.push(number);

  localStorage.setItem(
    "rab7Tasks_" + currentUser.username,
    JSON.stringify(completedTasks)
  );

  try{

    await saveBalance();

    updateBalance();

    updateTasks();

  }catch(error){

    userBalance -= points;

    completedTasks =
      completedTasks.filter(x => x !== number);

    alert(
      "❌ حدث خطأ في حفظ الرصيد:\n" +
      error.message
    );

    console.log(error);
  }
}


/* استبدال دالة updateTasks */

function updateTasks(){

  document.getElementById("remaining").textContent =
    4 - completedTasks.length;

  for(let i=1;i<=4;i++){

    const button =
      document.getElementById("task" + i);

    if(!button) continue;

    if(completedTasks.includes(i)){

      button.textContent =
        "✅ تمت اليوم";

      button.disabled = true;

    }else{

      button.disabled = false;

      if(i===1)
        button.textContent="🎁 تنفيذ المهمة +10";

      if(i===2)
        button.textContent="🎁 تنفيذ المهمة +20";

      if(i===3)
        button.textContent="🎁 تنفيذ المهمة +30";

      if(i===4)
        button.textContent="🎁 تنفيذ المهمة +40";
    }
  }
}
</script>
