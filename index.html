<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربح</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f2f4f7;
    font-family:Arial,sans-serif;
}
.box{
    max-width:450px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px #0002;
}
h1,h2{text-align:center}
input,button{
    width:100%;
    padding:13px;
    margin:7px 0;
    box-sizing:border-box;
    font-size:16px;
    border-radius:8px;
}
input{
    border:1px solid #ccc;
}
button{
    border:0;
    background:#1677ff;
    color:white;
}
.gray{background:#555}
.green{background:#159447}
.red{background:#d33}
.hidden{display:none}
.msg{text-align:center}
.points{
    text-align:center;
    font-size:32px;
    font-weight:bold;
}
.task{
    border:1px solid #ddd;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<div id="loginPage" class="box">

<h1>💰 ربح</h1>
<h2>تسجيل الدخول</h2>

<input id="loginUsername"
       type="text"
       placeholder="اسم المستخدم">

<input id="loginPassword"
       type="password"
       placeholder="كلمة المرور">

<button id="loginBtn">دخول</button>

<button id="openRegisterBtn" class="gray">
إنشاء حساب جديد
</button>

<p id="loginMessage" class="msg"></p>

</div>


<!-- إنشاء حساب -->
<div id="registerPage" class="box hidden">

<h1>💰 ربح</h1>
<h2>إنشاء حساب جديد</h2>

<input id="registerUsername"
       type="text"
       placeholder="اسم المستخدم">

<input id="registerPassword"
       type="password"
       placeholder="كلمة المرور">

<input id="registerReferral"
       type="text"
       placeholder="رمز الإحالة - اختياري">

<button id="registerBtn" class="green">
إنشاء الحساب
</button>

<button id="backLoginBtn" class="gray">
العودة لتسجيل الدخول
</button>

<p id="registerMessage" class="msg"></p>

</div>


<!-- التطبيق -->
<div id="appPage" class="box hidden">

<h1>💰 تطبيق ربح</h1>

<p style="text-align:center">
مرحباً <b id="currentUsername"></b>
</p>

<div class="points">
<span id="points">0</span>
<br>
<span style="font-size:15px">نقطة</span>
</div>

<hr>

<h2>📋 المهام</h2>

<div class="task">
احصل على 10 نقاط
<button class="taskBtn" data-points="10">
تنفيذ
</button>
</div>

<div class="task">
احصل على 20 نقطة
<button class="taskBtn" data-points="20">
تنفيذ
</button>
</div>

<div class="task">
احصل على 30 نقطة
<button class="taskBtn" data-points="30">
تنفيذ
</button>
</div>

<div class="task">
احصل على 40 نقطة
<button class="taskBtn" data-points="40">
تنفيذ
</button>
</div>

<div class="task">
احصل على 50 نقطة
<button class="taskBtn" data-points="50">
تنفيذ
</button>
</div>

<div class="task">
احصل على 60 نقطة
<button class="taskBtn" data-points="60">
تنفيذ
</button>
</div>

<hr>

<h2>👥 رمز الإحالة</h2>

<input id="myReferral" readonly>

<button id="copyReferralBtn">
نسخ رمز الإحالة
</button>

<hr>

<button id="logoutBtn" class="red">
تسجيل خروج
</button>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://jfpmniqxdwrvnpjlatkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u4ECIUzh0GhGkVil012xHQ_w_C7urtY";


/* =========================
   العناصر
========================= */

const loginPage =
document.getElementById("loginPage");

const registerPage =
document.getElementById("registerPage");

const appPage =
document.getElementById("appPage");

const loginUsername =
document.getElementById("loginUsername");

const loginPassword =
document.getElementById("loginPassword");

const loginMessage =
document.getElementById("loginMessage");

const registerUsername =
document.getElementById("registerUsername");

const registerPassword =
document.getElementById("registerPassword");

const registerReferral =
document.getElementById("registerReferral");

const registerMessage =
document.getElementById("registerMessage");

const points =
document.getElementById("points");

const currentUsername =
document.getElementById("currentUsername");

const myReferral =
document.getElementById("myReferral");


let currentUser = null;


/* =========================
   الاتصال بقاعدة البيانات
========================= */

async function supabase(path, options){

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
            method: options?.method || "GET",

            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":
                "Bearer " + SUPABASE_KEY,
                "Content-Type":
                "application/json",
                "Prefer":
                "return=representation"
            },

            body:options?.body
        }
    );

    const text =
    await response.text();

    let data = null;

    if(text){

        try{
            data = JSON.parse(text);
        }
        catch(e){
            data = text;
        }

    }

    if(!response.ok){

        throw new Error(
            typeof data === "string"
            ? data
            : JSON.stringify(data)
        );

    }

    return data;
}


/* =========================
   الصفحات
========================= */

function showLogin(){

    loginPage.classList.remove("hidden");

    registerPage.classList.add("hidden");

    appPage.classList.add("hidden");

}


function showRegister(){

    loginPage.classList.add("hidden");

    registerPage.classList.remove("hidden");

    appPage.classList.add("hidden");

}


function showApp(){

    loginPage.classList.add("hidden");

    registerPage.classList.add("hidden");

    appPage.classList.remove("hidden");

}


/* =========================
   تسجيل الدخول
========================= */

async function login(){

    const username =
    loginUsername.value.trim();

    const password =
    loginPassword.value;

    if(!username || !password){

        loginMessage.textContent =
        "اكتب اسم المستخدم وكلمة المرور.";

        return;
    }

    loginMessage.textContent =
    "جاري تسجيل الدخول...";

    try{

        const result =
        await supabase(
            "users?username=eq." +
            encodeURIComponent(username) +
            "&password=eq." +
            encodeURIComponent(password) +
            "&select=*"
        );


        if(!result || result.length === 0){

            loginMessage.textContent =
            "بيانات الدخول غير صحيحة.";

            return;
        }


        currentUser =
        result[0];


        localStorage.setItem(
            "ribhUserId",
            String(currentUser.id)
        );


        showApp();

        updateUser();

    }
    catch(error){

        console.error(error);

        loginMessage.textContent =
        "تعذر الاتصال بقاعدة البيانات.";

    }

}


/* =========================
   إنشاء الحساب
========================= */

async function register(){

    const username =
    registerUsername.value.trim();

    const password =
    registerPassword.value;

    const referral =
    registerReferral.value.trim();


    if(username.length < 3){

        registerMessage.textContent =
        "اسم المستخدم يجب أن يكون 3 أحرف على الأقل.";

        return;
    }


    if(password.length < 4){

        registerMessage.textContent =
        "كلمة المرور يجب أن تكون 4 أحرف على الأقل.";

        return;
    }


    registerMessage.textContent =
    "جاري إنشاء الحساب...";


    try{

        const existing =
        await supabase(
            "users?username=eq." +
            encodeURIComponent(username) +
            "&select=id"
        );


        if(existing && existing.length > 0){

            registerMessage.textContent =
            "اسم المستخدم موجود مسبقاً.";

            return;
        }


        const newUser =
        await supabase(
            "users",
            {
                method:"POST",

                body:JSON.stringify({
                    username:username,
                    password:password,
                    points:0,
                    referred_by:
                    referral || null
                })
            }
        );


        if(!newUser || newUser.length === 0){

            registerMessage.textContent =
            "لم يتم إنشاء الحساب.";

            return;
        }


        currentUser =
        newUser[0];


        /*
          مكافأة الإحالة
        */

        if(referral.startsWith("RAB7-")){

            const refName =
            referral.substring(5);


            if(
                refName &&
                refName !== username
            ){

                try{

                    const refUser =
                    await supabase(
                        "users?username=eq." +
                        encodeURIComponent(refName) +
                        "&select=*"
                    );


                    if(
                        refUser &&
                        refUser.length > 0
                    ){

                        const oldPoints =
                        Number(
                            refUser[0].points || 0
                        );


                        await supabase(
                            "users?id=eq." +
                            refUser[0].id,
                            {
                                method:"PATCH",

                                body:JSON.stringify({
                                    points:
                                    oldPoints + 50
                                })
                            }
                        );

                    }

                }
                catch(e){

                    console.log(e);

                }

            }

        }


        localStorage.setItem(
            "ribhUserId",
            String(currentUser.id)
        );


        showApp();

        updateUser();


    }
    catch(error){

        console.error(error);

        registerMessage.textContent =
        "تعذر الاتصال بقاعدة البيانات.";

    }

}


/* =========================
   تحديث المستخدم
========================= */

async function updateUser(){

    if(!currentUser){
        return;
    }


    try{

        const result =
        await supabase(
            "users?id=eq." +
            currentUser.id +
            "&select=*"
        );


        if(!result || result.length === 0){

            logout();

            return;
        }


        currentUser =
        result[0];


        points.textContent =
        Number(currentUser.points || 0);


        currentUsername.textContent =
        currentUser.username;


        myReferral.value =
        "RAB7-" + currentUser.username;


    }
    catch(error){

        console.error(error);

    }

}


/* =========================
   إضافة النقاط
========================= */

async function addPoints(amount){

    if(!currentUser){
        return;
    }


    try{

        const oldPoints =
        Number(currentUser.points || 0);


        const newPoints =
        oldPoints + Number(amount);


        await supabase(
            "users?id=eq." +
            currentUser.id,
            {
                method:"PATCH",

                body:JSON.stringify({
                    points:newPoints
                })
            }
        );


        currentUser.points =
        newPoints;


        updateUser();


        alert(
            "تمت إضافة " +
            amount +
            " نقطة."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "تعذر تحديث النقاط."
        );

    }

}


/* =========================
   المهام
========================= */

document
.querySelectorAll(".taskBtn")
.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            const amount =
            Number(
                this.getAttribute(
                    "data-points"
                )
            );

            addPoints(amount);

        }
    );

});


/* =========================
   نسخ الإحالة
========================= */

document.getElementById(
    "copyReferralBtn"
).addEventListener(
    "click",
    async function(){

        const code =
        myReferral.value;

        try{

            await navigator.clipboard.writeText(
                code
            );

            alert(
                "تم نسخ رمز الإحالة."
            );

        }
        catch(error){

            myReferral.select();

            document.execCommand("copy");

            alert(
                "تم نسخ رمز الإحالة."
            );

        }

    }
);


/* =========================
   تسجيل الخروج
========================= */

function logout(){

    currentUser = null;

    localStorage.removeItem(
        "ribhUserId"
    );

    showLogin();

}


/* =========================
   الأزرار
========================= */

document.getElementById(
    "loginBtn"
).addEventListener(
    "click",
    login
);


document.getElementById(
    "openRegisterBtn"
).addEventListener(
    "click",
    showRegister
);


document.getElementById(
    "backLoginBtn"
).addEventListener(
    "click",
    showLogin
);


document.getElementById(
    "registerBtn"
).addEventListener(
    "click",
    register
);


document.getElementById(
    "logoutBtn"
).addEventListener(
    "click",
    logout
);


/* =========================
   Enter
========================= */

loginPassword.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =========================
   الدخول التلقائي
========================= */

async function autoLogin(){

    const savedId =
    localStorage.getItem(
        "ribhUserId"
    );


    if(!savedId){

        showLogin();

        return;
    }


    try{

        const result =
        await supabase(
            "users?id=eq." +
            encodeURIComponent(savedId) +
            "&select=*"
        );


        if(
            result &&
            result.length > 0
        ){

            currentUser =
            result[0];

            showApp();

            updateUser();

        }
        else{

            showLogin();

        }

    }
    catch(error){

        console.error(error);

        showLogin();

    }

}


/* =========================
   تشغيل
========================= */

showLogin();

autoLogin();

</script>

</body>
</html>
