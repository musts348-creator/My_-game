<!DOCTYPE html>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#07152e,#123b70);
color:#fff;
min-height:100vh;
}

.container{
max-width:600px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,.10);
border-radius:18px;
padding:20px;
margin:15px 0;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h1,h2{
text-align:center;
}

input,select,button{
width:100%;
padding:13px;
margin:8px 0;
border:0;
border-radius:10px;
font-size:16px;
}

button{
background:#18a558;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button.secondary{
background:#2463b5;
}

button.danger{
background:#c62828;
}

button:disabled{
background:#777;
cursor:not-allowed;
}

.hidden{
display:none!important;
}

.balance{
font-size:30px;
text-align:center;
font-weight:bold;
margin:20px 0;
}

.task{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px;
margin:8px 0;
background:rgba(0,0,0,.18);
border-radius:10px;
}

.task button{
width:auto;
margin:0;
padding:9px 15px;

.nav{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:15px;
}

.nav button{
font-size:13px;
padding:10px 5px;
}

.message{
text-align:center;
padding:10px;
margin:10px 0;
border-radius:10px;
background:rgba(255,255,255,.12);
min-height:20px;
}

.small{
text-align:center;
font-size:13px;
opacity:.8;
}

</head>

<script>

const SUPABASE_URL =
"https://jfpmniqxdwrvnpjlatkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u4ECIUzh0GhGkVil012xHQ_w_C7urtY";

let user = null;


/* الاتصال بقاعدة البيانات */

async function api(table, options = {}) {

const response = await fetch(
SUPABASE_URL + "/rest/v1/" + table,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY,
"Content-Type":"application/json",
...(options.headers || {})
}
}
);

if(!response.ok){

const errorText = await response.text();

throw new Error(
errorText || "خطأ في قاعدة البيانات"
);

}

const text = await response.text();

return text ? JSON.parse(text) : [];

}

.getElementById("loginPage")

function showRegister(){

}


/* فتح التطبيق */

function showApp(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("registerPage")
.classList.add("hidden");

document
.getElementById("appPage")
.classList.remove("hidden");

}


/* إنشاء حساب */

async function register(){

const username =
document.getElementById("regUsername")
.value
.trim();

const password =
document.getElementById("regPassword")
.value
.trim();

const referral =
document.getElementById("regReferral")
.value
.trim();

const msg =
document.getElementById("registerMessage");


if(!username || !password){

"يرجى إدخال اسم المستخدم وكلمة المرور";

}


if(username.length < 3){

}

}


msg.textContent =
"جارٍ إنشاء الحساب...";

);


if(oldUsers.length > 0){

);

);

/* تسجيل الدخول */

async function login(){

const username =
document.getElementById("loginUsername")
.value
.trim();

const password =
document.getElementById("loginPassword")
.value
.trim();

const msg =
document.getElementById("loginMessage");


if(!username || !password){

msg.textContent =
"يرجى إدخال اسم المستخدم وكلمة المرور";

return;
}


msg.textContent =
"جارٍ تسجيل الدخول...";


try{

const users = await api(
"users?username=eq." +
encodeURIComponent(username) +
"&password=eq." +
encodeURIComponent(password) +
"&select=*"
);


if(!users.length){

msg.textContent =
"اسم المستخدم أو كلمة المرور غير صحيحة";

}


user = users[0];


localStorage.setItem(
"ribh_user",
JSON.stringify(user)
);

openApp();

},300);


}catch(error){

console.error(error);

msg.textContent =

/* فتح التطبيق */

function openApp(){

if(!user){

return;

}


showApp();


document.getElementById(
"currentUser"
).textContent =
user.username;


document.getElementById(
"balance"
).textContent =
Number(user.points) || 0;


document.getElementById(
"refCode"
).value =
"RAB7-" + user.username;


loadTasks();

loadHistory();

showSection("home");

}


/* التنقل */

function showSection(section){

.getElementById("homeSection")
.classList.add("hidden");

.getElementById("adsSection")
.classList.add("hidden");

document
.getElementById("refSection")
.classList.add("hidden");

document
.getElementById("withdrawSection")
.classList.add("hidden");

document
.getElementById("historySection")
.classList.add("hidden");

document
.getElementById("homeSection")
.classList.remove("hidden");

}


if(section === "ads"){

document
.getElementById("adsSection")
.classList.remove("hidden");

}

document
.getElementById("refSection")
.classList.remove("hidden");

}


if(section === "withdraw"){

.getElementById("withdrawSection")
.classList.remove("hidden");

}


if(section === "history"){

document

.classList.remove("hidden");

/* المهام */

const taskPoints =
[10,20,30,40,50,60];


function getToday(){

const d = new Date();

return (
d.getFullYear() +
"-" +
(d.getMonth()+1) +
"-" +
d.getDate()
);

}


function getDone(){

if(!user){

return [];

}


return JSON.parse(
localStorage.getItem(
"ribh_tasks_" +
user.username +
"_" +
getToday()
) || "[]"
);

}


/* عرض المهام */

function loadTasks(){

const box =
document.getElementById("tasks");

const done =
getDone();


box.innerHTML="";


taskPoints.forEach(
function(points,index){

const taskNumber =
index + 1;

const completed =
done.includes(taskNumber);


const div =
document.createElement("div");

div.className="task";


const span =
document.createElement("span");

span.textContent =
"المهمة " +
taskNumber +
" — " +
points +
" نقطة";


const button =
document.createElement("button");

button.type="button";

button.disabled =
completed;

button.textContent =
completed ? "تمت" : "تنفيذ";


button.onclick =
function(){

completeTask(
taskNumber,
points
);

};


div.appendChild(span);

div.appendChild(button);

box.appendChild(div);

}
);

}


/* تنفيذ المهمة */

async function completeTask(
number,
points
){

const done =
getDone();


if(done.includes(number)){

return;

}


try{

const newPoints =
(Number(user.points) || 0) +
points;


await api(
"users?id=eq." +
encodeURIComponent(user.id),
{
method:"PATCH",

headers:{
"Prefer":"return=minimal"
},

body:JSON.stringify({
points:newPoints
})

}
);


user.points =
newPoints;


localStorage.setItem(
"ribh_user",
JSON.stringify(user)
);


done.push(number);


localStorage.setItem(
"ribh_tasks_" +
user.username +
"_" +
getToday(),

JSON.stringify(done)
);


document.getElementById(
"balance"
).textContent =
newPoints;


loadTasks();


}catch(error){

console.error(error);

alert(
"تعذر إضافة النقاط"
);

}

}
