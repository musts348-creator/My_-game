<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>ربح</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#07152e,#123b70);
color:white;
min-height:100vh;
}
.container{
max-width:600px;
margin:auto;
padding:20px;
}
.card{
background:rgba(255,255,255,.1);
border-radius:18px;
padding:20px;
margin:15px 0;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}
h1,h2{text-align:center}
input,select,button{
width:100%;
padding:13px;
margin:8px 0;
border:0;
border-radius:10px;
font-size:16px;
}
button{
background:#18a558;
color:white;
font-weight:bold;
cursor:pointer;
}
button.secondary{background:#2463b5}
button.danger{background:#c62828}
.hidden{display:none}
.balance{
font-size:30px;
text-align:center;
font-weight:bold;
margin:20px 0;
}
.task{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px;
margin:8px 0;
background:rgba(0,0,0,.18);
border-radius:10px;
}
.task button{
width:auto;
margin:0;
padding:9px 15px;
}
.nav{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:15px;
}
.nav button{
font-size:13px;
padding:10px 5px;
}
.message{
text-align:center;
padding:10px;
margin:10px 0;
border-radius:10px;
background:rgba(255,255,255,.12);
}
.small{text-align:center;font-size:13px;opacity:.8}
</style>
</head>

<body>

<div class="container">

<!-- تسجيل الدخول -->
<div id="loginPage" class="card">
<h1>💰 ربح</h1>
<h2>تسجيل الدخول</h2>

<input id="loginUsername" type="text" placeholder="اسم المستخدم">
<input id="loginPassword" type="password" placeholder="كلمة المرور">

<button onclick="login()">تسجيل الدخول</button>
<button class="secondary" onclick="showRegister()">إنشاء حساب جديد</button>

<div id="loginMessage" class="message"></div>
</div>

<!-- إنشاء الحساب -->
<div id="registerPage" class="card hidden">
<h1>💰 ربح</h1>
<h2>إنشاء حساب جديد</h2>

<input id="regUsername" type="text" placeholder="اسم المستخدم">
<input id="regPassword" type="password" placeholder="كلمة المرور">
<input id="regReferral" type="text" placeholder="رمز الإحالة - اختياري">

<button onclick="register()">إنشاء الحساب</button>
<button class="secondary" onclick="showLogin()">العودة لتسجيل الدخول</button>

<div id="registerMessage" class="message"></div>
</div>

<!-- التطبيق -->
<div id="appPage" class="hidden">

<div class="card">
<h1>💰 ربح</h1>
<div class="balance">
رصيدك: <span id="balance">0</span> نقطة
</div>
<div class="small">مرحباً <span id="currentUser"></span></div>
</div>

<div id="homeSection" class="card">
<h2>📋 المهام اليومية</h2>
<div id="tasks"></div>
</div>

<div id="adsSection" class="card hidden">
<h2>📺 مشاهدة الإعلانات</h2>
<p style="text-align:center">
شاهد الإعلان لمدة 10 ثوانٍ واحصل على 10 نقاط.
</p>
<button onclick="watchAd()">مشاهدة الإعلان</button>
<div id="adMessage" class="message"></div>
</div>

<div id="refSection" class="card hidden">
<h2>👥 الإحالة</h2>
<p>رمز الإحالة الخاص بك:</p>
<input id="refCode" readonly>
<p class="small">شارك الرمز مع أصدقائك واحصل على نقاط.</p>
</div>

<div id="withdrawSection" class="card hidden">
<h2>💳 سحب الأرباح</h2>

<select id="withdrawMethod" onchange="changeMethod()">
<option value="zain">Zain Cash</option>
<option value="mastercard">Mastercard</option>
</select>

<input id="withdrawAccount" type="text" placeholder="رقم الحساب">

<input id="withdrawPoints" type="number" placeholder="عدد النقاط">

<button onclick="withdraw()">طلب السحب</button>

<div id="withdrawMessage" class="message"></div>
</div>

<div id="historySection" class="card hidden">
<h2>📜 سجل السحب</h2>
<div id="history"></div>
</div>

<div class="nav">
<button onclick="showSection('home')">🏠 الرئيسية</button>
<button onclick="showSection('ads')">📺 الإعلانات</button>
<button onclick="showSection('ref')">👥 الإحالة</button>
<button onclick="showSection('withdraw')">💳 السحب</button>
<button onclick="showSection('history')">📜 السجل</button>
<button class="danger" onclick="logout()">🚪 خروج</button>
</div>

</div>
</div>

<script>
const SUPABASE_URL="https://jfpmniqxdwrvnpjlatkk.supabase.co";
const SUPABASE_KEY="sb_publishable_u4ECIUzh0GhGkVil012xHQ_w_C7urtY";

let user=null;

async function api(table,options={}){
const response=await fetch(
SUPABASE_URL+"/rest/v1/"+table,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
...(options.headers||{})
}
}
);

if(!response.ok){
const text=await response.text();
throw new Error(text||"خطأ في الاتصال بقاعدة البيانات");
}

const text=await response.text();
return text?JSON.parse(text):[];
}

function showLogin(){
document.getElementById("loginPage").classList.remove("hidden");
document.getElementById("registerPage").classList.add("hidden");
document.getElementById("appPage").classList.add("hidden");
}

function showRegister(){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("registerPage").classList.remove("hidden");
document.getElementById("appPage").classList.add("hidden");
}

function showApp(){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("registerPage").classList.add("hidden");
document.getElementById("appPage").classList.remove("hidden");
}

async function register(){

const username=document.getElementById("regUsername").value.trim();
const password=document.getElementById("regPassword").value.trim();
const referral=document.getElementById("regReferral").value.trim();

const msg=document.getElementById("registerMessage");

if(!username||!password){
msg.textContent="يرجى إدخال اسم المستخدم وكلمة المرور";
return;
}

if(username.length<3){
msg.textContent="اسم المستخدم يجب أن يكون 3 أحرف على الأقل";
return;
}

if(password.length<4){
msg.textContent="كلمة المرور يجب أن تكون 4 أحرف على الأقل";
return;
}

msg.textContent="جارٍ إنشاء الحساب...";

try{

const old=await api(
"users?username=eq."+encodeURIComponent(username)+"&select=*"
);

if(old.length>0){
msg.textContent="اسم المستخدم مستخدم مسبقاً";
return;
}

const newUser={
username:username,
password:password,
points:0
};

const created=await api(
"users",
{
method:"POST",
headers:{
"Prefer":"return=representation"
},
body:JSON.stringify(newUser)
}
);

if(!created.length){
throw new Error("لم يتم إنشاء الحساب");
}

user=created[0];

localStorage.setItem("ribh_user",JSON.stringify(user));

if(referral){
try{
const refUsers=await api(
"users?select=*&referral_code=eq."+encodeURIComponent(referral)
);

if(refUsers.length>0){
const refUser=refUsers[0];

await api(
"users?id=eq."+encodeURIComponent(refUser.id),
{
method:"PATCH",
headers:{
"Prefer":"return=minimal"
},
body:JSON.stringify({
points:(Number(refUser.points)||0)+50
})
}
);
}
}catch(e){}
}

msg.textContent="تم إنشاء الحساب بنجاح";

setTimeout(()=>{
openApp();
},500);

}catch(e){

console.error(e);
msg.textContent="تعذر الاتصال بقاعدة البيانات";

}

}

async function login(){

const username=document.getElementById("loginUsername").value.trim();
const password=document.getElementById("loginPassword").value.trim();

const msg=document.getElementById("loginMessage");

if(!username||!password){
msg.textContent="يرجى إدخال اسم المستخدم وكلمة المرور";
return;
}

msg.textContent="جارٍ تسجيل الدخول...";

try{

const users=await api(
"users?username=eq."+encodeURIComponent(username)+"&password=eq."+encodeURIComponent(password)+"&select=*"
);

if(!users.length){
msg.textContent="اسم المستخدم أو كلمة المرور غير صحيحة";
return;
}

user=users[0];

localStorage.setItem("ribh_user",JSON.stringify(user));

msg.textContent="تم تسجيل الدخول";

setTimeout(()=>{
openApp();
},300);

}catch(e){

console.error(e);
msg.textContent="تعذر الاتصال بقاعدة البيانات";

}

}

async function openApp(){

if(!user)return;

showApp();

document.getElementById("currentUser").textContent=user.username;
document.getElementById("balance").textContent=Number(user.points)||0;

const code="RAB7-"+user.username;
document.getElementById("refCode").value=code;

loadTasks();
loadHistory();
showSection("home");

}

function showSection(section){

document.getElementById("homeSection").classList.add("hidden");
document.getElementById("adsSection").classList.add("hidden");
document.getElementById("refSection").classList.add("hidden");
document.getElementById("withdrawSection").classList.add("hidden");
document.getElementById("historySection").classList.add("hidden");

if(section==="home"){
document.getElementById("homeSection").classList.remove("hidden");
}

if(section==="ads"){
document.getElementById("adsSection").classList.remove("hidden");
}

if(section==="ref"){
document.getElementById("refSection").classList.remove("hidden");
}

if(section==="withdraw"){
document.getElementById("withdrawSection").classList.remove("hidden");
}

if(section==="history"){
document.getElementById("historySection").classList.remove("hidden");
loadHistory();
}

}

const taskPoints=[10,20,30,40,50,60];

function getToday(){
const d=new Date();
return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function getDone(){
return JSON.parse(
localStorage.getItem("ribh_tasks_"+user.username+"_"+getToday())||"[]"
);
}

function loadTasks(){

const box=document.getElementById("tasks");
const done=getDone();

box.innerHTML="";

taskPoints.forEach((points,index)=>{

const taskNumber=index+1;
const completed=done.includes(taskNumber);

const div=document.createElement("div");
div.className="task";

div.innerHTML=
"<span>المهمة "+taskNumber+" — "+points+" نقطة</span>"+
"<button "+(completed?"disabled":"")+" onclick=\"completeTask("+taskNumber+","+points+")\">"+
(completed?"تمت":"تنفيذ")+
"</button>";

box.appendChild(div);

});

}

async function completeTask(number,points){

const done=getDone();

if(done.includes(number))return;

try{

const newPoints=(Number(user.points)||0)+points;

await api(
"users?id=eq."+encodeURIComponent(user.id),
{
method:"PATCH",
headers:{
"Prefer":"return=minimal"
},
body:JSON.stringify({
points:newPoints
})
}
);

user.points=newPoints;

localStorage.setItem("ribh_user",JSON.stringify(user));

done.push(number);

localStorage.setItem(
"ribh_tasks_"+user.username+"_"+getToday(),
JSON.stringify(done)
);

document.getElementById("balance").textContent=newPoints;

loadTasks();

}catch(e){

alert("تعذر إضافة النقاط");

}

}

async function watchAd(){

const msg=document.getElementById("adMessage");

msg.textContent="جارٍ مشاهدة الإعلان... 10 ثوانٍ";

await new Promise(resolve=>setTimeout(resolve,10000));

try{

const newPoints=(Number(user.points)||0)+10;

await api(
"users?id=eq."+encodeURIComponent(user.id),
{
method:"PATCH",
headers:{
"Prefer":"return=minimal"
},
body:JSON.stringify({
points:newPoints
})
}
);

user.points=newPoints;

localStorage.setItem("ribh_user",JSON.stringify(user));

document.getElementById("balance").textContent=newPoints;

msg.textContent="تمت إضافة 10 نقاط إلى رصيدك";

}catch(e){

msg.textContent="حدث خطأ أثناء إضافة النقاط";

}

}

function changeMethod(){

const method=document.getElementById("withdrawMethod").value;
const input=document.getElementById("withdrawAccount");

if(method==="zain"){
input.placeholder="رقم Zain Cash - 11 رقم";
}else{
input.placeholder="رقم Mastercard - 16 رقم";
}

}

async function withdraw(){

const method=document.getElementById("withdrawMethod").value;
const account=document.getElementById("withdrawAccount").value.trim();
const points=Number(document.getElementById("withdrawPoints").value);

const msg=document.getElementById("withdrawMessage");

if(points<100){
msg.textContent="الحد الأدنى للسحب هو 100 نقطة";
return;
}

if(points>(Number(user.points)||0)){
msg.textContent="رصيدك غير كافٍ";
return;
}

if(method==="zain" && !/^07[0-9]{9}$/.test(account)){
msg.textContent="رقم Zain Cash يجب أن يكون 11 رقماً ويبدأ بـ 07";
return;
}

if(method==="mastercard" && !/^[0-9]{16}$/.test(account)){
msg.textContent="رقم Mastercard يجب أن يكون 16 رقماً";
return;
}

msg.textContent="جارٍ إرسال الطلب...";

try{

const request={
user_id:user.id,
username:user.username,
method:method,
account:account,
points:points,
status:"قيد المراجعة"
};

await api(
"withdrawals",
{
method:"POST",
headers:{
"Prefer":"return=representation"
},
body:JSON.stringify(request)
}
);

const newPoints=(Number(user.points)||0)-points;

await api(
"users?id=eq."+encodeURIComponent(user.id),
{
method:"PATCH",
headers:{
"Prefer":"return=minimal"
},
body:JSON.stringify({
points:newPoints
})
}
);

user.points=newPoints;

localStorage.setItem("ribh_user",JSON.stringify(user));

document.getElementById("balance").textContent=newPoints;

msg.textContent="تم إرسال طلب السحب وقيد المراجعة";

document.getElementById("withdrawAccount").value="";
document.getElementById("withdrawPoints").value="";

loadHistory();

}catch(e){

console.error(e);
msg.textContent="تعذر إرسال طلب السحب";

}

}

async function loadHistory(){

if(!user)return;

const box=document.getElementById("history");

box.innerHTML="جارٍ تحميل السجل...";

try{

const rows=await api(
"withdrawals?user_id=eq."+encodeURIComponent(user.id)+"&select=*&order=created_at.desc"
);

if(!rows.length){
box.innerHTML="<p style='text-align:center'>لا توجد عمليات سحب</p>";
return;
}

box.innerHTML="";

rows.forEach(row=>{

const div=document.createElement("div");
div.className="task";

div.innerHTML=
"<div>"+
"<b>"+(row.method||"")+"</b><br>"+
(row.points||0)+" نقطة<br>"+
"<small>"+(row.status||"")+"</small>"+
"</div>";

box.append
