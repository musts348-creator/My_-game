<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربح</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    margin:0;
    padding:20px;
}
.box{
    max-width:450px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 2px 10px #0002;
}
h1,h2{text-align:center}
input,button{
    width:100%;
    padding:13px;
    margin:7px 0;
    box-sizing:border-box;
    font-size:16px;
    border-radius:8px;
}
input{border:1px solid #ccc}
button{
    border:0;
    background:#1677ff;
    color:white;
}
.gray{background:#555}
.green{background:#159447}
.red{background:#d33}
.hidden{display:none}
.msg{text-align:center;margin:10px 0}
.points{
    text-align:center;
    font-size:30px;
    font-weight:bold;
}
.task{
    border:1px solid #ddd;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}
</style>
</head>

<body>

<!-- صفحة الدخول -->
<div id="loginPage" class="box">

<h1>💰 ربح</h1>
<h2>تسجيل الدخول</h2>

<input id="loginUser" type="text" placeholder="اسم المستخدم">
<input id="loginPass" type="password" placeholder="كلمة المرور">

<button id="loginButton">دخول</button>

<button id="registerPageButton" class="gray">
إنشاء حساب جديد
</button>

<div id="loginMsg" class="msg"></div>

</div>


<!-- صفحة إنشاء الحساب -->
<div id="registerPage" class="box hidden">

<h1>💰 ربح</h1>
<h2>إنشاء حساب</h2>

<input id="newUser" type="text" placeholder="اسم المستخدم">

<input id="newPass" type="password" placeholder="كلمة المرور">

<input id="referralCode" type="text"
placeholder="رمز الإحالة - اختياري">

<button id="createButton" class="green">
إنشاء الحساب
</button>

<button id="backButton" class="gray">
العودة لتسجيل الدخول
</button>

<div id="registerMsg" class="msg"></div>

</div>


<!-- التطبيق -->
<div id="appPage" class="box hidden">

<h1>💰 تطبيق ربح</h1>

<p style="text-align:center">
مرحباً <b id="userName"></b>
</p>

<div class="points">
<span id="userPoints">0</span>
<br>
<span style="font-size:16px">نقطة</span>
</div>

<hr>

<h2>المهام</h2>

<div class="task">
احصل على 10 نقاط
<button class="taskButton" data-points="10">
تنفيذ
</button>
</div>

<div class="task">
احصل على 20 نقطة
<button class="taskButton" data-points="20">
تنفيذ
</button>
</div>

<div class="task">
احصل على 30 نقطة
<button class="taskButton" data-points="30">
تنفيذ
</button>
</div>

<div class="task">
احصل على 40 نقطة
<button class="taskButton" data-points="40">
تنفيذ
</button>
</div>

<div class="task">
احصل على 50 نقطة
<button class="taskButton" data-points="50">
تنفيذ
</button>
</div>

<div class="task">
احصل على 60 نقطة
<button class="taskButton" data-points="60">
تنفيذ
</button>
</div>

<hr>

<h2>👥 الإحالة</h2>

<p>رمز الإحالة الخاص بك:</p>

<input id="myReferral" readonly>

<button id="copyButton">
نسخ رمز الإحالة
</button>

<p>
عند تسجيل شخص جديد باستخدام رمزك،
تحصل على 50 نقطة.
</p>

<hr>

<button id="logoutButton" class="red">
تسجيل خروج
</button>

</div>


<script>

/* =========================
   بيانات Supabase
========================= */

const SUPABASE_URL =
"https://jfpmniqxdwrvnpjlatkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u4ECIUzh0GhGkVil012xHQ_w_C7urtY";


/* =========================
   طلب إلى Supabase
========================= */

async function requestSupabase(path, options = {}){

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
            ...options,
            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":"Bearer " + SUPABASE_KEY,
                "Content-Type":"application/json",
                "Prefer":"return=representation",
                ...(options.headers || {})
            }
        }
    );

    const text = await response.text();

    let data;

    try{
        data = text ? JSON.parse(text) : null;
    }catch(e){
        data = text;
    }

    if(!response.ok){
        throw new Error(
            typeof data === "string"
            ? data
            : JSON.stringify(data)
        );
    }

    return data;
}


/* =========================
   العناصر
========================= */

const loginPage =
document.getElementById("loginPage");

const registerPage =
document.getElementById("registerPage");

const appPage =
document.getElementById("appPage");

const loginUser =
document.getElementById("loginUser");

const loginPass =
document.getElementById("loginPass");

const loginMsg =
document.getElementById("loginMsg");

const newUser =
document.getElementById("newUser");

const newPass =
document.getElementById("newPass");

const referralCode =
document.getElementById("referralCode");

const registerMsg =
document.getElementById("registerMsg");

let currentUser = null;


/* =========================
   الانتقال بين الصفحات
========================= */

function showLogin(){

    loginPage.classList.remove("hidden");
    registerPage.classList.add("hidden");
    appPage.classList.add("hidden");

}

function showRegister(){

    loginPage.classList.add("hidden");
    registerPage.classList.remove("hidden");
    appPage.classList.add("hidden");

}

function showApp(){

    loginPage.classList.add("hidden");
    registerPage.classList.add("hidden");
    appPage.classList.remove("hidden");

}


/* =========================
   تسجيل الدخول
========================= */

async function doLogin(){

    const username =
    loginUser.value.trim();

    const password =
    loginPass.value;

    if(!username || !password){

        loginMsg.textContent =
        "أدخل اسم المستخدم وكلمة المرور.";

        return;
    }

    loginMsg.textContent =
    "جاري تسجيل الدخول...";

    try{

        const users =
        await requestSupabase(
            "users?username=eq." +
            encodeURIComponent(username) +
            "&password=eq." +
            encodeURIComponent(password) +
            "&select=*"
        );

        if(!users || users.length === 0){

            loginMsg.textContent =
            "اسم المستخدم أو كلمة المرور غير صحيحة.";

            return;
        }

        currentUser = users[0];

        localStorage.setItem(
            "ribhUserId",
            String(currentUser.id)
        );

        showApp();

        updateApp();

    }catch(error){

        console.error(error);

        loginMsg.textContent =
        "تعذر الاتصال بقاعدة البيانات.";

    }

}


/* =========================
   إنشاء الحساب
========================= */

async function createAccount(){

    const username =
    newUser.value.trim();

    const password =
    newPass.value;

    const referral =
    referralCode.value.trim();

    if(username.length < 3){

        registerMsg.textContent =
        "اسم المستخدم يجب أن يكون 3 أحرف على الأقل.";

        return;
    }

    if(password.length < 4){

        registerMsg.textContent =
        "كلمة المرور يجب أن تكون 4 أحرف على الأقل.";

        return;
    }

    registerMsg.textContent =
    "جاري إنشاء الحساب...";

    try{

        const existing =
        await requestSupabase(
            "users?username=eq." +
            encodeURIComponent(username) +
            "&select=id"
        );

        if(existing && existing.length > 0){

            registerMsg.textContent =
            "اسم المستخدم موجود مسبقاً.";

            return;
        }


        const created =
        await requestSupabase(
            "users",
            {
                method:"POST",
                body:JSON.stringify({
                    username:username,
                    password:password,
                    points:0,
                    referred_by:
                    referral || null
                })
            }
        );


        if(!created || created.length === 0){

            registerMsg.textContent =
            "تعذر إنشاء الحساب.";

            return;
        }


        currentUser = created[0];


        /* مكافأة الإحالة */

        if(referral.startsWith("RAB7-")){

            const refName =
            referral.substring(5);

            if(
                refName &&
                refName !== username
            ){

                try{

                    const refUsers =
                    await requestSupabase(
                        "users?username=eq." +
                        encodeURIComponent(refName) +
                        "&select=*"
                    );

                    if(
                        refUsers &&
                        refUsers.length > 0
                    ){

                        const refUser =
                        refUsers[0];

                        const newPoints =
                        Number(refUser.points || 0) + 50;

                        await requestSupabase(
                            "users?id=eq." +
                            refUser.id,
                            {
                                method:"PATCH",
                                body:JSON.stringify({
                                    points:newPoints
                                })
                            }
                        );

                    }

                }catch(e){

                    console.log(
                        "Referral error:",
                        e
                    );

                }

            }

        }


        localStorage.setItem(
            "ribhUserId",
            String(currentUser.id)
        );

        showApp();

        updateApp();


    }catch(error){

        console.error(error);

        registerMsg.textContent =
        "تعذر الاتصال بقاعدة البيانات.";

    }

}


/* =========================
   تحديث التطبيق
========================= */

async function updateApp(){

    if(!currentUser){
        return;
    }

    try{

        const users =
        await requestSupabase(
            "users?id=eq." +
            currentUser.id +
            "&select=*"
        );

        if(!users || users.length === 0){

            doLogout();

            return;
        }

        currentUser = users[0];

        const points =
        Number(currentUser.points || 0);

        document.getElementById(
            "userPoints"
        ).textContent = points;

        document.getElementById(
            "userName"
        ).textContent =
        currentUser.username;

        document.getElementById(
            "myReferral"
        ).value =
        "RAB7-" + currentUser.username;

    }catch(error){

        console.error(error);

    }

}


/* =========================
   إضافة نقاط
========================= */

async function addPoints(amount){

    if(!currentUser){
        return;
    }

    try{

        const oldPoints =
        Number(currentUser.points || 0);

        const newPoints =
        oldPoints + Number(amount);

        await requestSupabase(
            "users?id=eq." +
            currentUser.id,
            {
                method:"PATCH",
                body:JSON.stringify({
                    points:newPoints
                })
            }
        );

        currentUser.points =
        newPoints;

        updateApp();

        alert(
            "تمت إضافة " +
            amount +
            " نقطة."
        );

    }catch(error){

        console.error(error);

        alert(
            "تعذر تحديث النقاط."
        );

    }

}


/* =========================
   أزرار المهام
========================= */

document
.querySelectorAll(".taskButton")
.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            const amount =
            Number(
                this.getAttribute(
                    "data-points"
                )
            );

            addPoints(amount);

        }
    );

});


/* =========================
   نسخ رمز الإحالة
========================= */

document.getElementById(
    "copyButton"
).addEventListener(
    "click",
    async function(){

        const code =
        document.getElementById(
            "myReferral"
        ).value;

        try{

            await navigator.clipboard.writeText(
                code
            );

            alert(
                "تم نسخ رمز الإحالة."
            );

        }catch(error){

            const input =
            document.getElementById(
                "myReferral"
            );

            input.select();

            document.execCommand("copy");

            alert(
                "تم نسخ رمز الإحالة."
            );

        }

    }
);


/* =========================
   تسجيل الخروج
========================= */

function doLogout(){

    currentUser = null;

    localStorage.removeItem(
        "ribhUserId"
    );

    showLogin();

}


/* =========================
   الأزرار الرئيسية
========================= */

document.getElementById(
    "loginButton"
).addEventListener(
    "click",
    doLogin
);


document.getElementById(
    "registerPageButton"
).addEventListener(
    "click",
    showRegister
);


document.getElementById(
    "backButton"
).addEventListener(
    "click",
    showLogin
);


document.getElementById(
    "createButton"
).addEventListener(
    "click",
    createAccount
);


document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    doLogout
);


/* الضغط على Enter */

loginPass.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            doLogin();
        }

    }
);


/* =========================
   الدخول التلقائي
========================= */

async function autoLogin(){

    const savedId =
    localStorage.getItem(
        "ribhUserId"
    );

    if(!savedId){

        showLogin();

        return;
    }

    try{

        const users =
        await requestSupabase(
            "users?id=eq." +
            encodeURIComponent(savedId) +
            "&select=*"
        );

        if(
            users &&
            users.length > 0
        ){

            currentUser = users[0];

            showApp();

            updateApp();

        }else{

            showLogin();

        }

    }catch(error){

        console.error(error);

        showLogin();

    }

}


/* =========================
   تشغيل التطبيق
========================= */

showLogin();

autoLogin();

</script>

</body>
</html>
