<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>ربح</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#07152e,#123b70);color:white}
.container{max-width:600px;margin:auto;padding:20px}
.card{background:#ffffff18;border-radius:18px;padding:20px;margin:15px 0}
h1,h2{text-align:center}
input,select,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:10px;font-size:16px;box-sizing:border-box}
button{background:#18a558;color:white;font-weight:bold}

.balance{text-align:center;font-size:30px;font-weight:bold;margin:20px}
.task{display:flex;justify-content:space-between;align-items:center;background:#0003;padding:12px;margin:8px 0;border-radius:10px}
.task button{width:auto;padding:9px 15px}

<body>
<div class="container">

<div id="loginPage" class="card">
<h1>💰 ربح</h1>
<h2>تسجيل الدخول</h2>
<input id="loginUsername" placeholder="اسم المستخدم">
<input id="loginPassword" type="password" placeholder="كلمة المرور">

<div id="registerPage" class="card hidden">

<h2>إنشاء حساب جديد</h2>

<button class="secondary" onclick="showLogin()">العودة لتسجيل الدخول</button>

</div>

<div id="appPage" class="hidden">

<div class="card">

<div style="text-align:center">مرحباً <span id="currentUser"></span></div>
</div>

<div id="homeSection" class="card">
<h2>📋 المهام اليومية</h2>
<div id="tasks"></div>
</div>

<div id="adsSection" class="card hidden">
<h2>📺 الإعلانات</h2>
<p style="text-align:center">شاهد الإعلان 10 ثوانٍ واحصل على 10 نقاط.</p>
<button onclick="watchAd()">مشاهدة الإعلان</button>
<div id="adMessage" class="message"></div>
</div>

<div id="refSection" class="card hidden">

<p>رمز الإحالة الخاص بك:</p>
<input id="refCode" readonly>
</div>

<div id="withdrawSection" class="card hidden">
<h2>💳 سحب الأرباح</h2>
<select id="withdrawMethod" onchange="changeMethod()">
<option value="zain">Zain Cash</option>
<option value="mastercard">Mastercard</option>
</select>
<input id="withdrawAccount" placeholder="رقم Zain Cash - 11 رقم">
<input id="withdrawPoints" type="number" placeholder="عدد النقاط">
<button onclick="withdraw()">طلب السحب</button>
<div id="withdrawMessage" class="message"></div>
</div>

<div id="historySection" class="card hidden">
<h2>📜 سجل السحب</h2>
<div id="history"></div>
</div>

<div class="nav">
<button onclick="showSection('home')">🏠 الرئيسية</button>
<button onclick="showSection('ads')">📺 الإعلانات</button>
<button onclick="showSection('ref')">👥 الإحالة</button>
<button onclick="showSection('withdraw')">💳 السحب</button>
<button onclick="showSection('history')">📜 السجل</button>
<button class="danger" onclick="logout()">🚪 خروج</button>
</div>

</div>
</div>

<script>const SUPABASE_URL="https://jfpmniqxdwrvnpjlatkk.supabase.co";
const SUPABASE_KEY="sb_publishable_u4ECIUzh0GhGkVil012xHQ_w_C7urtY";

async function api(path,options={}){
  const res=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    ...options,
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });
  if(!res.ok) throw new Error(await res.text());
  return res.status===204?null:await res.json();
}

let user=null;

function showLogin(){
  loginPage.classList.remove("hidden");
  registerPage.classList.add("hidden");
  appPage.classList.add("hidden");
}

function showRegister(){
  loginPage.classList.add("hidden");
  registerPage.classList.remove("hidden");
  appPage.classList.add("hidden");
}

function showApp(){
  loginPage.classList.add("hidden");
  registerPage.classList.add("hidden");
  appPage.classList.remove("hidden");
}

async function register(){
  const username=regUsername.value.trim();
  const password=regPassword.value;

  if(!username||!password){
    registerMessage.textContent="أدخل اسم المستخدم وكلمة المرور";
    return;
  }

  try{
    const old=await api("users?username=eq."+encodeURIComponent(username)+"&select=id");

    if(old.length){
      registerMessage.textContent="اسم المستخدم موجود مسبقاً";
      return;
    }

    const data=await api("users",{
      method:"POST",
      headers:{"Prefer":"return=representation"},
      body:JSON.stringify({
        username:username,
        password:password,
        points:0
      })
    });

    user=data[0];
    localStorage.setItem("ribh_user",JSON.stringify(user));
    openApp();
  }catch(e){
    registerMessage.textContent="تعذر الاتصال بقاعدة البيانات";
  }
}

async function login(){
  const username=loginUsername.value.trim();
  const password=loginPassword.value;

  if(!username||!password){
    loginMessage.textContent="أدخل اسم المستخدم وكلمة المرور";
    return;
  }

  try{
    const data=await api(
      "users?username=eq."+encodeURIComponent(username)+
      "&password=eq."+encodeURIComponent(password)+"&select=*"
    );

    if(!data.length){
      loginMessage.textContent="اسم المستخدم أو كلمة المرور غير صحيحة";
      return;
    }

    user=data[0];
    localStorage.setItem("ribh_user",JSON.stringify(user));
    openApp();
  }catch(e){
    loginMessage.textContent="تعذر الاتصال بقاعدة البيانات";
  }
}

function openApp(){
  showApp();
  currentUser.textContent=user.username;
  balance.textContent=user.points||0;
  refCode.value="RAB7-"+user.username;
  loadTasks();
}
