<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربح</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:white;
  min-height:100vh;
}

.container{
  width:92%;
  max-width:500px;
  margin:30px auto;
}

.card{
  background:white;
  color:#111827;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1,h2{
  text-align:center;
}

input,select,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  border:0;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#9ca3af;
}

.balance{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  color:#2563eb;
}

.task{
  border:1px solid #ddd;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
}

.small{
  font-size:13px;
  color:#6b7280;
  text-align:center;
}

.history{
  background:#f3f4f6;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}

.hidden{
  display:none;
}

.logout{
  background:#dc2626;
}

.success{
  color:green;
  text-align:center;
  margin-top:10px;
}

.error{
  color:red;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div id="loginPage" class="card">

<h1>💰 تطبيق ربح</h1>

<h2>تسجيل الدخول</h2>

<input id="username" type="text" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<button onclick="register()">إنشاء حساب جديد</button>

<div id="loginMessage"></div>

<p class="small">
هذا التطبيق متصل بقاعدة بيانات Supabase.
</p>

</div>


<div id="appPage" class="hidden">

<div class="card">

<h1>💰 ربح</h1>

<p style="text-align:center">
مرحباً <b id="userName"></b>
</p>

<div class="balance">
<span id="balance">0</span>
</div>

<p style="text-align:center">نقطة</p>

<button onclick="logout()" class="logout">
تسجيل الخروج
</button>

</div>


<div class="card">

<h2>🎯 المهام اليومية</h2>

<p style="text-align:center">
المهام المتبقية:
<b id="remaining">3</b>
</p>

<div class="task">
<b>المهمة 1</b>
<p>احصل على 10 نقاط</p>
<button id="task1" onclick="completeTask(1)">
🎁 تنفيذ المهمة +10
</button>
</div>

<div class="task">
<b>المهمة 2</b>
<p>احصل على 20 نقطة</p>
<button id="task2" onclick="completeTask(2)">
🎁 تنفيذ المهمة +20
</button>
</div>

<div class="task">
<b>المهمة 3</b>
<p>احصل على 30 نقطة</p>
<button id="task3" onclick="completeTask(3)">
🎁 تنفيذ المهمة +30
</button>
</div>

</div>


<div class="card">

<h2>💵 طلب سحب</h2>

<p class="small">
الحد الأدنى للسحب: 100 نقطة
</p>

<select id="method">
<option value="زين كاش">زين كاش</option>
<option value="Mastercard">Mastercard</option>
</select>

<input id="account" type="text"
placeholder="رقم زين كاش أو بيانات الحساب">

<button onclick="withdraw()">
طلب سحب
</button>

<div id="withdrawMessage"></div>

</div>


<div class="card">

<h2>📋 سجل السحب</h2>

<div id="history">
لا توجد طلبات سحب.
</div>

</div>

</div>

</div>


<script>

/* ==============================
   بيانات Supabase
   ============================== */

const SUPABASE_URL =
"https://jfpmniqxdwrvnpjlatkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u4ECIUzh0GhGkVil012xHQ_w_C7urtY";


/* ==============================
   متغيرات التطبيق
   ============================== */

let currentUser = null;
let userBalance = 0;
let completedTasks = [];


/* ==============================
   اتصال Supabase
   ============================== */

async function supabaseRequest(table, options = {}){

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + table,
    {
      ...options,
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    }
  );

  if(!response.ok){

    const errorText = await response.text();

    throw new Error(errorText);
  }

  const text = await response.text();

  return text ? JSON.parse(text) : null;
}


/* ==============================
   إنشاء حساب
   ============================== */

async function register(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(!username || !password){

    showLoginMessage(
      "❌ اكتب اسم المستخدم وكلمة المرور.",
      true
    );

    return;
  }

  try{

    const existing = await supabaseRequest(
      "users?select=id&username=eq." +
      encodeURIComponent(username)
    );

    if(existing && existing.length > 0){

      showLoginMessage(
        "❌ اسم المستخدم موجود مسبقاً.",
        true
      );

      return;
    }

    await supabaseRequest(
      "users",
      {
        method:"POST",

        headers:{
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({
          username:username,
          password:password,
          balance:0
        })
      }
    );

    showLoginMessage(
      "✅ تم إنشاء الحساب. اضغط دخول."
    );

  }catch(error){

    showLoginMessage(
      "❌ حدث خطأ أثناء إنشاء الحساب.",
      true
    );

    console.log(error);
  }
}


/* ==============================
   تسجيل الدخول
   ============================== */

async function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(!username || !password){

    showLoginMessage(
      "❌ اكتب اسم المستخدم وكلمة المرور.",
      true
    );

    return;
  }

  try{

    const users = await supabaseRequest(
      "users?select=*&username=eq." +
      encodeURIComponent(username) +
      "&password=eq." +
      encodeURIComponent(password)
    );

    if(!users || users.length === 0){

      showLoginMessage(
        "❌ اسم المستخدم أو كلمة المرور غير صحيحة.",
        true
      );

      return;
    }

    currentUser = users[0];

    userBalance =
      Number(currentUser.balance || 0);

    localStorage.setItem(
      "rab7User",
      currentUser.username
    );

    await loadTasks();

    showApp();

  }catch(error){

    showLoginMessage(
      "❌ تعذر الاتصال بقاعدة البيانات.",
      true
    );

    console.log(error);
  }
}


/* ==============================
   عرض التطبيق
   ============================== */

function showApp(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("appPage")
    .classList.remove("hidden");

  document.getElementById("userName").textContent =
    currentUser.username;

  updateBalance();

  updateTasks();

  loadHistory();
}


/* ==============================
   الرصيد
   ============================== */

function updateBalance(){

  document.getElementById("balance").textContent =
    userBalance;
}


/* ==============================
   تحديث الرصيد
   ============================== */

async function saveBalance(){

  await supabaseRequest(
    "users?username=eq." +
    encodeURIComponent(currentUser.username),
    {
      method:"PATCH",

      headers:{
        "Prefer":"return=minimal"
      },

      body:JSON.stringify({
        balance:userBalance
      })
    }
  );
}


/* ==============================
   المهام اليومية
   ============================== */

async function loadTasks(){

  const savedDate =
    localStorage.getItem(
      "rab7Date_" + currentUser.username
    );

  const today =
    new Date().toISOString().split("T")[0];

  if(savedDate !== today){

    completedTasks = [];

    localStorage.setItem(
      "rab7Date_" + currentUser.username,
      today
    );

    localStorage.setItem(
      "rab7Tasks_" + currentUser.username,
      JSON.stringify([])
    );

  }else{

    completedTasks =
      JSON.parse(
        localStorage.getItem(
          "rab7Tasks_" + currentUser.username
        ) || "[]"
      );
  }
}


async function completeTask(number){

  if(completedTasks.includes(number)){
    return;
  }

  let points = 0;

  if(number === 1) points = 10;
  if(number === 2) points = 20;
  if(number === 3) points = 30;

  userBalance += points;

  completedTasks.push(number);

  localStorage.setItem(
    "rab7Tasks_" + currentUser.username,
    JSON.stringify(completedTasks)
  );

  try{

    await saveBalance();

    updateBalance();

    updateTasks();

  }catch(error){

    userBalance -= points;

    completedTasks =
      completedTasks.filter(x => x !== number);

    alert("❌ حدث خطأ في حفظ الرصيد.");

    console.log(error);
  }
}


function updateTasks(){

  document.getElementById("remaining").textContent =
    3 - completedTasks.length;

  for(let i=1;i<=3;i++){

    const button =
      document.getElementById("task" + i);

    if(completedTasks.includes(i)){

      button.textContent =
        "✅ تمت اليوم";

      button.disabled = true;

    }else{

      button.disabled = false;

      if(i===1)
        button.textContent="🎁 تنفيذ المهمة +10";

      if(i===2)
        button.textContent="🎁 تنفيذ المهمة +20";

      if(i===3)
        button.textContent="🎁 تنفيذ المهمة +30";
    }
  }
}


/* ==============================
   السحب
   ============================== */

async function withdraw(){

  const method =
    document.getElementById("method").value;

  const account =
    document.getElementById("account").value.trim();

  if(userBalance < 100){

    showWithdrawMessage(
      "❌ تحتاج إلى 100 نقطة على الأقل.",
      true
    );

    return;
  }

  if(!account){

    showWithdrawMessage(
      "❌ اكتب بيانات السحب.",
      true
    );

    return;
  }

  if(method === "زين كاش"){

    if(!/^07[0-9]{8}$/.test(account)){

      showWithdrawMessage(
        "❌ رقم زين كاش يجب أن يكون 10 أرقام ويبدأ بـ 07.",
        true
      );

      return;
    }
  }

  if(method === "Mastercard"){

    if(!/^[0-9]{16}$/.test(account)){

      showWithdrawMessage(
        "❌ رقم Mastercard يجب أن يكون 16 رقماً.",
        true
      );

      return;
    }

    alert(
      "⚠️ لا تستخدم رقم بطاقة حقيقي في هذه النسخة التجريبية."
    );
  }

  try{

    await supabaseRequest(
      "withdrawals",
      {
        method:"POST",

        headers:{
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({

          username:currentUser.username,

          method:method,

          account:
            method === "Mastercard"
            ? "****" + account.slice(-4)
            : account,

          points:userBalance,

          status:"قيد المراجعة"
        })
      }
    );

    userBalance = 0;

    await saveBalance();

    updateBalance();

    document.getElementById("account").value = "";

    showWithdrawMessage(
      "✅ تم إرسال طلب السحب للمراجعة."
    );

    loadHistory();

  }catch(error){

    showWithdrawMessage(
      "❌ حدث خطأ أثناء إرسال الطلب.",
      true
    );

    console.log(error);
  }
}


/* ==============================
   سجل السحب
   ============================== */

async function loadHistory(){

  try{

    const records =
      await supabaseRequest(
        "withdrawals?select=*&username=eq." +
        encodeURIComponent(currentUser.username) +
        "&order=created_at.desc"
      );

    const history =
      document.getElementById("history");

    if(!records || records.length === 0){

      history.innerHTML =
        "لا توجد طلبات سحب.";

      return;
    }

    history.innerHTML = "";

    records.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "history";

      div.innerHTML = `
        <b>طريقة السحب:</b> ${item.method}<br>
        <b>الحساب:</b> ${item.account}<br>
        <b>النقاط:</b> ${item.points}<br>
        <b>الحالة:</b> ${item.status}<br>
        <b>التاريخ:</b> ${new Date(item.created_at).toLocaleString("ar-IQ")}
      `;

      history.appendChild(div);

    });

  }catch(error){

    document.getElementById("history").textContent =
      "تعذر تحميل سجل السحب.";

    console.log(error);
  }
}


/* ==============================
   تسجيل الخروج
   ============================== */

function logout(){

  localStorage.removeItem("rab7User");

  location.reload();
}


/* ==============================
   الرسائل
   ============================== */

function showLoginMessage(message,error=false){

  const box =
    document.getElementById("loginMessage");

  box.textContent = message;

  box.className =
    error ? "error" : "success";
}


function showWithdrawMessage(message,error=false){

  const box =
    document.getElementById("withdrawMessage");

  box.textContent = message;

  box.className =
    error ? "error" : "success";
}


/* ==============================
   فتح الحساب المحفوظ
   ============================== */

async function autoLogin(){

  const username =
    localStorage.getItem("rab7User");

  if(!username) return;

  try{

    const users =
      await supabaseRequest(
        "users?select=*&username=eq." +
        encodeURIComponent(username)
      );

    if(users && users.length > 0){

      currentUser = users[0];

      userBalance =
        Number(currentUser.balance || 0);

      await loadTasks();

      showApp();
    }

  }catch(error){

    console.log(error);
  }
}

autoLogin();

</script>

</body>
</html>
